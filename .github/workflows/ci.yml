name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel any in-progress run for the same workflow + ref so that a
# force-push or rapid iteration doesn't queue a backlog of stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test on macOS
  test-macos:
    name: Test macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build Package
        run: swift build

      - name: Run Tests
        run: swift test

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme AGUISwift-Package \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -quiet || true

      - name: Build for macOS
        run: |
          xcodebuild build \
            -scheme AGUISwift-Package \
            -destination 'platform=macOS' \
            -quiet || true

  # Lint and format check
  lint:
    name: Lint
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew list swiftlint &>/dev/null || brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint

      - name: Verify Package Structure
        run: |
          swift package dump-package > /dev/null
          echo "✓ Package structure is valid"

  # Build all targets individually
  build-targets:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest

    strategy:
      matrix:
        target: [AGUICore, AGUIClient, AGUITools, AGUIAgentSDK]
      max-parallel: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build ${{ matrix.target }}
        run: swift build --target ${{ matrix.target }}

  # Test coverage (runs on macOS only)
  coverage:
    name: Test Coverage
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Run Tests with Coverage
        run: swift test --enable-code-coverage

