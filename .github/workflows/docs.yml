name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-documentation:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      
      - name: Verify Swift version
        run: swift --version
      
      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Resolve dependencies
        run: swift package resolve
      
      - name: Build Swift package
        run: |
          swift build -c release
      
      - name: Generate documentation
        run: |
          # Get repository name for hosting-base-path (NO leading slash)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Repository name: $REPO_NAME"
          
          # Generate documentation for AGUICore (primary module)
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target AGUICore \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path "$REPO_NAME"
          
          echo "✅ Documentation generated successfully"
          
          # Verify output
          ls -la ./docs/
          
          # Verify output and ensure index.html exists
          if [ -d "./docs/documentation" ]; then
            echo "✓ Documentation directory found"
            ls -la ./docs/documentation/
            # Create index.html if it doesn't exist
            if [ ! -f "./docs/index.html" ]; then
              echo "Creating index.html..."
              printf '%s\n' \
                '<!DOCTYPE html>' \
                '<html lang="en">' \
                '<head>' \
                '    <meta charset="UTF-8">' \
                '    <meta name="viewport" content="width=device-width, initial-scale=1.0">' \
                '    <title>AGUISwift Documentation</title>' \
                '    <meta http-equiv="refresh" content="0; url=documentation/aguicore/">' \
                '</head>' \
                '<body>' \
                '    <p><a href="documentation/aguicore/">Go to AGUICore documentation</a></p>' \
                '</body>' \
                '</html>' > ./docs/index.html
            fi
          elif [ -f "./docs/index.html" ]; then
            echo "✓ index.html found"
            ls -la ./docs/
          else
            echo "Warning: Expected documentation structure not found"
            echo "Contents of docs directory:"
            ls -la ./docs/
            # Create a basic index.html as fallback
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '    <meta charset="UTF-8">' \
              '    <title>AGUISwift Documentation</title>' \
              '</head>' \
              '<body>' \
              '    <h1>AGUISwift Documentation</h1>' \
              '    <p>Documentation is being generated. Please check back later.</p>' \
              '</body>' \
              '</html>' > ./docs/index.html
          fi
          
          # Final verification
          if [ ! -f "./docs/index.html" ]; then
            echo "Error: index.html was not created"
            exit 1
          fi
          echo "✓ index.html verified"
      
      - name: Fix permissions
        run: |
          chmod -R +rX ./docs
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
  
  deploy-documentation:
    needs: build-documentation
    runs-on: ubuntu-latest
    
    # Only deploy on main branch
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4