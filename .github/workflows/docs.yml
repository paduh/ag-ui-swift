name: Documentation

on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]

  workflow_dispatch:

permissions:

  contents: read

  pages: write

  id-token: write

concurrency:

  group: "pages"

  cancel-in-progress: false

jobs:

  build-docs:

    runs-on: macos-latest

    steps:

    - name: Checkout

      uses: actions/checkout@v4

    - name: Generate documentation with DocC

      run: |

        mkdir -p docs
        
        # Generate docs for each target
        # Note: Each target gets its own subdirectory and base path
        for target in AGUICore AGUIClient AGUITools AGUIAgentSDK; do
          echo "📚 Generating docs for $target..."
          swift package --allow-writing-to-directory ./docs/$target \
            generate-documentation --target $target \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path /ag-ui-swift/$target \
            --output-path ./docs/$target
          
          # Verify index.html was created
          if [ ! -f "./docs/$target/index.html" ]; then
            echo "⚠️  Warning: index.html not found for $target"
          else
            echo "✅ Successfully generated docs for $target"
          fi
        done
        
        # Create .nojekyll to prevent Jekyll processing (important for GitHub Pages)
        touch ./docs/.nojekyll
        
        # List generated directories for debugging
        echo "📁 Generated documentation structure:"
        ls -la ./docs/ | grep "^d" | awk '{print $NF}'

    - name: Fix filenames for artifact upload
      run: |
        # Replace colons with hyphens in filenames
        find ./docs -depth -name "*:*" | while read -r file; do
          dir=$(dirname "$file")
          base=$(basename "$file")
          newbase=$(echo "$base" | tr ':' '-')
          mv "$file" "$dir/$newbase"
        done
        
        # Update JSON references (macOS sed syntax - build runs on macos-latest)
        find ./docs -name "*.json" -type f -exec sed -i '' 's/:/\\-/g' {} +

    - name: Create landing page
      run: |
        cat > ./docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>AG-UI Swift SDK Documentation</title>
          <style>
            * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
            }
            body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
              line-height: 1.6;
              color: #333;
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              min-height: 100vh;
              padding: 2rem;
            }
            .container {
              max-width: 1200px;
              margin: 0 auto;
            }
            header {
              text-align: center;
              color: white;
              margin-bottom: 3rem;
            }
            header h1 {
              font-size: 3rem;
              margin-bottom: 0.5rem;
              text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            }
            header p {
              font-size: 1.2rem;
              opacity: 0.9;
            }
            .targets {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
              gap: 2rem;
              margin-top: 2rem;
            }
            .target-card {
              background: white;
              border-radius: 12px;
              padding: 2rem;
              box-shadow: 0 10px 30px rgba(0,0,0,0.2);
              transition: transform 0.3s ease, box-shadow 0.3s ease;
              text-decoration: none;
              color: inherit;
              display: block;
            }
            .target-card:hover {
              transform: translateY(-5px);
              box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            }
            .target-card h2 {
              color: #667eea;
              margin-bottom: 1rem;
              font-size: 1.8rem;
            }
            .target-card p {
              color: #666;
              margin-bottom: 1.5rem;
            }
            .target-card .link {
              color: #667eea;
              font-weight: 600;
              text-decoration: none;
              display: inline-flex;
              align-items: center;
              gap: 0.5rem;
            }
            .target-card .link:hover {
              text-decoration: underline;
            }
            .target-card .link::after {
              content: '→';
              transition: transform 0.3s ease;
            }
            .target-card:hover .link::after {
              transform: translateX(5px);
            }
            footer {
              text-align: center;
              color: white;
              margin-top: 4rem;
              opacity: 0.9;
            }
            footer a {
              color: white;
              text-decoration: underline;
            }
            @media (max-width: 768px) {
              header h1 {
                font-size: 2rem;
              }
              .targets {
                grid-template-columns: 1fr;
              }
            }
          </style>
        </head>
        <body>
          <div class="container">
            <header>
              <h1>AG-UI Swift SDK</h1>
              <p>Comprehensive API Documentation</p>
            </header>
            
            <div class="targets">
              <a href="./AGUICore/" class="target-card">
                <h2>AGUICore</h2>
                <p>Core event types, decoding infrastructure, and protocol implementations. The foundation of the AG-UI Swift SDK.</p>
                <span class="link">View Documentation</span>
              </a>
              
              <a href="./AGUIClient/" class="target-card">
                <h2>AGUIClient</h2>
                <p>Client-side functionality for connecting to AG-UI protocol servers and managing agent interactions.</p>
                <span class="link">View Documentation</span>
              </a>
              
              <a href="./AGUITools/" class="target-card">
                <h2>AGUITools</h2>
                <p>Utility tools and helpers for working with AG-UI events and protocol features.</p>
                <span class="link">View Documentation</span>
              </a>
              
              <a href="./AGUIAgentSDK/" class="target-card">
                <h2>AGUIAgentSDK</h2>
                <p>High-level APIs for building agent applications with AG-UI protocol support.</p>
                <span class="link">View Documentation</span>
              </a>
            </div>
            
            <footer>
              <p>
                <a href="https://github.com/paduh/ag-ui-swift">GitHub Repository</a> |
                <a href="https://github.com/paduh/ag-ui-swift/issues">Report Issues</a>
              </p>
            </footer>
          </div>
        </body>
        </html>
        EOF

    - name: Upload documentation artifacts

      uses: actions/upload-artifact@v4

      with:

        name: documentation

        path: ./docs

        retention-days: 30

  deploy-docs:

    needs: build-docs

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

      

    steps:

    - name: Download documentation artifacts

      uses: actions/download-artifact@v4

      with:

        name: documentation

        path: ./docs

        

    - name: Setup Pages

      uses: actions/configure-pages@v4

      

    - name: Upload to GitHub Pages

      uses: actions/upload-pages-artifact@v3

      with:

        path: ./docs

        

    - name: Deploy to GitHub Pages

      id: deployment

      uses: actions/deploy-pages@v4