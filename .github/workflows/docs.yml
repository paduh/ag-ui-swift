name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: "6.2"
      
      - name: Build Documentation
        run: |
          swift package resolve
          
          # Create docs directory
          mkdir -p docs
          
          # Generate documentation using swift-docc-plugin
          # This will fail the workflow if documentation generation fails
          swift package --allow-writing-to-directory docs generate-documentation \
            --target AGUICore \
            --target AGUIClient \
            --target AGUITools \
            --target AGUIAgentSDK \
            --transform-for-static-hosting \
            --hosting-base-path /ag-ui-swift \
            --output-path docs
          
          echo "Documentation generated successfully"
          ls -la docs/
          
          # Verify documentation was generated
          if [ ! -d "docs/documentation" ] && [ ! -f "docs/index.html" ]; then
            echo "Error: Documentation was not generated"
            exit 1
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
