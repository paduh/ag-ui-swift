name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: "5.9"
      
      - name: Build Documentation
        run: |
          swift package resolve
          
          # Generate documentation for static hosting
          swift package --allow-writing-to-directory docs generate-documentation \
            --target AGUICore \
            --target AGUIClient \
            --target AGUITools \
            --target AGUIAgentSDK \
            --transform-for-static-hosting \
            --hosting-base-path /ag-ui-swift \
            --output-path docs || {
              echo "Documentation generation failed, trying alternative method..."
              # Alternative: Build with xcodebuild
              xcodebuild docbuild \
                -scheme AGUISwift \
                -destination 'generic/platform=iOS' \
                -derivedDataPath .build \
                OTHER_DOCC_FLAGS="--transform-for-static-hosting --hosting-base-path /ag-ui-swift"
              
              # Find and copy the generated documentation
              find .build -name "*.doccarchive" -exec cp -R {} docs/ \;
            }
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
