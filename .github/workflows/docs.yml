name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-documentation:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      
      - name: Verify Swift version
        run: swift --version
      
      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Resolve dependencies
        run: swift package resolve
      
      - name: Build Swift package
        run: |
          swift build -c release
      
      - name: Generate documentation
        run: |
          # Get repository name for hosting-base-path
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Repository name: $REPO_NAME"
          
          # Generate documentation for AGUICore (primary module)
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target AGUICore \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path "$REPO_NAME"
          
          echo "✅ Documentation generated successfully"
          
          # Verify output
          if [ -d "./docs/documentation" ]; then
            echo "✓ Documentation directory found"
            ls -la ./docs/documentation/
          elif [ -f "./docs/index.html" ]; then
            echo "✓ index.html found"
            ls -la ./docs/
          else
            echo "Warning: Expected documentation structure not found"
            echo "Contents of docs directory:"
            ls -la ./docs/
            # Don't fail, as archives might be in a different structure
          fi
      
      - name: Fix permissions
        run: |
          chmod -R +rX ./docs
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
  
  deploy-documentation:
    needs: build-documentation
    runs-on: ubuntu-latest
    
    # Only deploy on main branch
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4