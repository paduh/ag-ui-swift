name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build Documentation
        run: |
          swift package resolve
          
          # Create docs directory
          mkdir -p docs
          
          # Generate documentation using swift-docc-plugin
          # This will fail the workflow if documentation generation fails
          swift package --allow-writing-to-directory docs generate-documentation \
            --target AGUICore \
            --target AGUIClient \
            --target AGUITools \
            --target AGUIAgentSDK \
            --transform-for-static-hosting \
            --hosting-base-path /ag-ui-swift \
            --output-path docs
          
          echo "Documentation generated successfully"
          ls -la docs/
          
          # Verify documentation was generated
          # Check for .doccarchive files (what's actually created) or transformed static HTML
          if ls docs/*.doccarchive 1> /dev/null 2>&1; then
            echo "✓ Documentation archives found"
            # Create index.html for GitHub Pages if it doesn't exist
            if [ ! -f "docs/index.html" ]; then
              echo "Creating index.html for GitHub Pages..."
              cat > docs/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGUISwift Documentation</title>
    <meta http-equiv="refresh" content="0; url=AGUICore.doccarchive/index.html">
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; text-align: center; }
        a { color: #007AFF; }
    </style>
</head>
<body>
    <h1>AGUISwift Documentation</h1>
    <p>Redirecting to documentation...</p>
    <p><a href="AGUICore.doccarchive/index.html">Click here if you are not redirected</a></p>
</body>
</html>
EOF
            fi
          elif [ -d "docs/documentation" ] || [ -f "docs/index.html" ]; then
            echo "✓ Static HTML documentation found"
          else
            echo "Error: Documentation was not generated"
            exit 1
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
