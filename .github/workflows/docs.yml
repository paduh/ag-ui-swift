name: Documentation

on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]

  workflow_dispatch:

permissions:

  contents: read

  pages: write

  id-token: write

concurrency:

  group: "pages"

  cancel-in-progress: false

jobs:

  build-docs:

    runs-on: macos-latest

    

    steps:

    - name: Checkout

      uses: actions/checkout@v4

      

    - name: Select Xcode version

      run: sudo xcode-select -s /Applications/Xcode_15.2.app

      

    - name: Generate documentation with DocC

      run: |

        mkdir -p docs
        
        # Generate docs for each target
        for target in AGUICore AGUIClient AGUITools AGUIAgentSDK; do
          echo "📚 Generating docs for $target..."
          swift package --allow-writing-to-directory ./docs/$target \
            generate-documentation --target $target \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path ag-ui-swift/$target \
            --output-path ./docs/$target
        done

        

    - name: Upload documentation artifacts

      uses: actions/upload-artifact@v4

      with:

        name: documentation

        path: ./docs

        retention-days: 30

  deploy-docs:

    needs: build-docs

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

      

    steps:

    - name: Download documentation artifacts

      uses: actions/download-artifact@v4

      with:

        name: documentation

        path: ./docs

        

    - name: Setup Pages

      uses: actions/configure-pages@v4

      

    - name: Upload to GitHub Pages

      uses: actions/upload-pages-artifact@v3

      with:

        path: ./docs

        

    - name: Deploy to GitHub Pages

      id: deployment

      uses: actions/deploy-pages@v4