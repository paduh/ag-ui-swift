name: Documentation

on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]

  workflow_dispatch:

permissions:

  contents: read

  pages: write

  id-token: write

concurrency:

  group: "pages"

  cancel-in-progress: false

jobs:

  build-docs:

    runs-on: macos-latest

    steps:

    - name: Checkout

      uses: actions/checkout@v4

    - name: Generate documentation with DocC

      run: |

        mkdir -p docs
        
        # Generate docs for each target
        # Note: Each target gets its own subdirectory and base path
        for target in AGUICore AGUIClient AGUITools AGUIAgentSDK; do
          echo "📚 Generating docs for $target..."
          swift package --allow-writing-to-directory ./docs/$target \
            generate-documentation --target $target \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path /ag-ui-swift/$target \
            --output-path ./docs/$target
          
          # Verify index.html was created
          if [ ! -f "./docs/$target/index.html" ]; then
            echo "⚠️  Warning: index.html not found for $target"
          else
            echo "✅ Successfully generated docs for $target"
          fi
        done
        
        # Create .nojekyll to prevent Jekyll processing (important for GitHub Pages)
        touch ./docs/.nojekyll
        
        # List generated directories for debugging
        echo "📁 Generated documentation structure:"
        ls -la ./docs/ | grep "^d" | awk '{print $NF}'

    - name: Fix filenames for artifact upload
      run: |
        # GitHub Actions artifact upload doesn't support colons in filenames
        # We need to rename files AND update JSON references properly
        
        cat > /tmp/fix_colons.py << 'EOF'
        import os
        import json
        import glob
        import re
        from pathlib import Path
        
        def rename_files_with_colons(root_dir):
            """Recursively rename all files and directories containing colons"""
            renamed_count = 0
            
            # First, rename directories (must be done depth-first)
            for root, dirs, files in os.walk(root_dir, topdown=False):
                for dirname in dirs:
                    if ':' in dirname:
                        old_path = os.path.join(root, dirname)
                        new_dirname = dirname.replace(':', '-')
                        new_path = os.path.join(root, new_dirname)
                        print(f"Renaming directory: {old_path} -> {new_path}")
                        os.rename(old_path, new_path)
                        renamed_count += 1
            
            # Then rename files
            for root, dirs, files in os.walk(root_dir):
                for filename in files:
                    if ':' in filename:
                        old_path = os.path.join(root, filename)
                        new_filename = filename.replace(':', '-')
                        new_path = os.path.join(root, new_filename)
                        print(f"Renaming file: {old_path} -> {new_path}")
                        os.rename(old_path, new_path)
                        renamed_count += 1
            
            print(f"Renamed {renamed_count} files/directories")
            return renamed_count
        
        def fix_json_paths(obj):
            """Recursively fix path strings in JSON object by replacing : with -"""
            if isinstance(obj, dict):
                return {k: fix_json_paths(v) for k, v in obj.items()}
            elif isinstance(obj, list):
                return [fix_json_paths(item) for item in obj]
            elif isinstance(obj, str):
                # Replace colons in strings that look like paths or URLs
                # Match paths (contain /) or URLs (start with http://, https://, doc://, etc.)
                if '/' in obj or re.match(r'^[a-z]+://', obj):
                    return obj.replace(':', '-')
                return obj
            else:
                return obj
        
        # Rename all files and directories with colons
        print("Step 1: Renaming files and directories with colons...")
        rename_files_with_colons('./docs')
        
        # Update JSON file references
        print("\nStep 2: Updating JSON references...")
        json_files = list(glob.glob('./docs/**/*.json', recursive=True))
        print(f"Found {len(json_files)} JSON files to process")
        
        for json_file in json_files:
            try:
                with open(json_file, 'r', encoding='utf-8') as f:
                    data = json.load(f)
        
                # Fix paths in the JSON
                fixed_data = fix_json_paths(data)
        
                # Write back
                with open(json_file, 'w', encoding='utf-8') as f:
                    json.dump(fixed_data, f, ensure_ascii=False, separators=(',', ':'))
            except Exception as e:
                print(f"Error processing {json_file}: {e}")
        
        # Also fix HTML files that might reference paths with colons
        print("\nStep 3: Updating HTML references...")
        html_files = list(glob.glob('./docs/**/*.html', recursive=True))
        print(f"Found {len(html_files)} HTML files to process")
        
        for html_file in html_files:
            try:
                with open(html_file, 'r', encoding='utf-8') as f:
                    content = f.read()
                
                # Replace colons in paths/URLs within HTML
                # Match href, src, or any attribute with a path
                fixed_content = re.sub(r'(href|src|data-path|data-url)=["\']([^"\']*):([^"\']*)["\']', 
                                      r'\1="\2-\3"', content)
                
                if fixed_content != content:
                    with open(html_file, 'w', encoding='utf-8') as f:
                        f.write(fixed_content)
            except Exception as e:
                print(f"Error processing {html_file}: {e}")
        
        # Verify no files with colons remain
        print("\nStep 4: Verifying no files with colons remain...")
        remaining = []
        for root, dirs, files in os.walk('./docs'):
            for name in dirs + files:
                if ':' in name:
                    remaining.append(os.path.join(root, name))
        
        if remaining:
            print(f"WARNING: {len(remaining)} files/directories with colons still remain:")
            for item in remaining:
                print(f"  - {item}")
        else:
            print("✓ All files and directories with colons have been renamed")
        
        print("\nAll fixes completed successfully")
        EOF
        
        python3 /tmp/fix_colons.py

    - name: Create landing page
      run: |
        cat > ./docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>AG-UI Swift SDK Documentation</title>
          <style>
            * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
            }
            body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
              line-height: 1.6;
              color: #333;
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              min-height: 100vh;
              padding: 2rem;
            }
            .container {
              max-width: 1200px;
              margin: 0 auto;
            }
            header {
              text-align: center;
              color: white;
              margin-bottom: 3rem;
            }
            header h1 {
              font-size: 3rem;
              margin-bottom: 0.5rem;
              text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            }
            header p {
              font-size: 1.2rem;
              opacity: 0.9;
            }
            .targets {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
              gap: 2rem;
              margin-top: 2rem;
            }
            .target-card {
              background: white;
              border-radius: 12px;
              padding: 2rem;
              box-shadow: 0 10px 30px rgba(0,0,0,0.2);
              transition: transform 0.3s ease, box-shadow 0.3s ease;
              text-decoration: none;
              color: inherit;
              display: block;
            }
            .target-card:hover {
              transform: translateY(-5px);
              box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            }
            .target-card h2 {
              color: #667eea;
              margin-bottom: 1rem;
              font-size: 1.8rem;
            }
            .target-card p {
              color: #666;
              margin-bottom: 1.5rem;
            }
            .target-card .link {
              color: #667eea;
              font-weight: 600;
              text-decoration: none;
              display: inline-flex;
              align-items: center;
              gap: 0.5rem;
            }
            .target-card .link:hover {
              text-decoration: underline;
            }
            .target-card .link::after {
              content: '→';
              transition: transform 0.3s ease;
            }
            .target-card:hover .link::after {
              transform: translateX(5px);
            }
            footer {
              text-align: center;
              color: white;
              margin-top: 4rem;
              opacity: 0.9;
            }
            footer a {
              color: white;
              text-decoration: underline;
            }
            @media (max-width: 768px) {
              header h1 {
                font-size: 2rem;
              }
              .targets {
                grid-template-columns: 1fr;
              }
            }
          </style>
        </head>
        <body>
          <div class="container">
            <header>
              <h1>AG-UI Swift SDK</h1>
              <p>Comprehensive API Documentation</p>
            </header>
            
            <div class="targets">
              <a href="./AGUICore/" class="target-card">
                <h2>AGUICore</h2>
                <p>Core event types, decoding infrastructure, and protocol implementations. The foundation of the AG-UI Swift SDK.</p>
                <span class="link">View Documentation</span>
              </a>
              
              <a href="./AGUIClient/" class="target-card">
                <h2>AGUIClient</h2>
                <p>Client-side functionality for connecting to AG-UI protocol servers and managing agent interactions.</p>
                <span class="link">View Documentation</span>
              </a>
              
              <a href="./AGUITools/" class="target-card">
                <h2>AGUITools</h2>
                <p>Utility tools and helpers for working with AG-UI events and protocol features.</p>
                <span class="link">View Documentation</span>
              </a>
              
              <a href="./AGUIAgentSDK/" class="target-card">
                <h2>AGUIAgentSDK</h2>
                <p>High-level APIs for building agent applications with AG-UI protocol support.</p>
                <span class="link">View Documentation</span>
              </a>
            </div>
            
            <footer>
              <p>
                <a href="https://github.com/paduh/ag-ui-swift">GitHub Repository</a> |
                <a href="https://github.com/paduh/ag-ui-swift/issues">Report Issues</a>
              </p>
            </footer>
          </div>
        </body>
        </html>
        EOF

    - name: Upload documentation artifacts

      uses: actions/upload-artifact@v4

      with:

        name: documentation

        path: ./docs

        retention-days: 30

  deploy-docs:

    needs: build-docs

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

      

    steps:

    - name: Download documentation artifacts

      uses: actions/download-artifact@v4

      with:

        name: documentation

        path: ./docs

        

    - name: Setup Pages

      uses: actions/configure-pages@v4

      

    - name: Upload to GitHub Pages

      uses: actions/upload-pages-artifact@v3

      with:

        path: ./docs

        

    - name: Deploy to GitHub Pages

      id: deployment

      uses: actions/deploy-pages@v4